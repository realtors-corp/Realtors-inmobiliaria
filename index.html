<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REALTORS - Inmobiliaria</title>
    <style>
        :root { 
            --primary: #111111; 
            --secondary: #475569; 
            --accent: #D8A520; 
            --bg: #F8FAFC; 
        }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; background-color: var(--bg); color: var(--secondary); }
        
        /* Header y Logo - SIN 'sticky' para que desaparezca al bajar */
        header { background-color: var(--primary); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .logo-img { height: 90px; object-fit: contain; } /* Tamaño aumentado para escritorio */
        
        .btn-whatsapp { background-color: transparent; color: var(--accent); border: 2px solid var(--accent); padding: 0.5rem 1.5rem; border-radius: 4px; text-decoration: none; font-weight: bold; transition: all 0.3s ease; }
        .btn-whatsapp:hover { background-color: var(--accent); color: var(--primary); }
        
        /* Hero Section */
        .hero { text-align: center; padding: 8rem 2rem 6rem; background: linear-gradient(rgba(17, 17, 17, 0.85), rgba(17, 17, 17, 0.85)), url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=1920&q=80') center/cover; color: white; }
        .hero h1 { font-size: 5rem; margin-bottom: 0.5rem; color: var(--accent); letter-spacing: 4px; font-weight: 800;} /* Título central REALTORS */
        .hero p { font-size: 1.2rem; max-width: 600px; margin: 0 auto 2rem auto; opacity: 0.9; }
        
        /* Filtros y Catálogo */
        .filters { display: flex; gap: 1rem; justify-content: center; padding: 1.5rem; background: white; margin: -3rem 5% 3rem; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); flex-wrap: wrap; position: relative; border-top: 4px solid var(--accent); }
        .filter-group { display: flex; flex-direction: column; gap: 0.5rem; flex: 1; min-width: 200px; }
        .filter-group label { font-size: 0.85rem; font-weight: 600; color: var(--primary); text-transform: uppercase; }
        select { padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 1rem; color: var(--primary); outline: none; cursor: pointer; }
        
        .catalog-header { padding: 0 5%; margin-bottom: 1.5rem; }
        .catalog-header h2 { font-size: 2rem; color: var(--primary); }
        .catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2rem; padding: 0 5% 4rem; }
        
        .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); transition: transform 0.3s; cursor: pointer; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .card-img-wrapper { position: relative; }
        .card img { width: 100%; height: 260px; object-fit: cover; }
        .tag { position: absolute; top: 1rem; left: 1rem; background: var(--primary); color: var(--accent); padding: 0.4rem 1rem; border-radius: 4px; font-size: 0.85rem; font-weight: bold; text-transform: uppercase; }
        .card-body { padding: 1.5rem; }
        .price { font-size: 1.75rem; font-weight: 800; color: var(--accent); margin: 0; }
        .title { font-size: 1.2rem; font-weight: 600; margin: 0.5rem 0 1rem 0; color: var(--primary); }
        .features { display: flex; justify-content: space-between; padding-top: 1rem; border-top: 1px solid #e2e8f0; font-size: 0.9rem; font-weight: 500; color: var(--primary); }
        
        /* Modal (Ventana Emergente) */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); overflow-y: auto; padding-top: 2rem; }
        .modal-content { background-color: white; margin: auto; padding: 0; border-radius: 8px; width: 90%; max-width: 900px; position: relative; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); margin-bottom: 3rem;}
        .close-btn { position: absolute; top: 15px; right: 25px; color: white; background: var(--primary); border-radius: 50%; width: 35px; height: 35px; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; cursor: pointer; z-index: 10; }
        .close-btn:hover { background: var(--accent); color: var(--primary); }
        
        /* Modal Body Details */
        .modal-gallery { display: flex; gap: 10px; overflow-x: auto; padding: 20px; background: #f1f5f9; border-radius: 8px 8px 0 0; }
        .modal-gallery img { height: 300px; width: auto; border-radius: 4px; object-fit: cover; }
        .modal-info { padding: 2rem; }
        .modal-info h2 { color: var(--primary); margin-top: 0; font-size: 2rem;}
        .modal-info .price { font-size: 2.2rem; margin-bottom: 1rem; }
        .modal-info p { line-height: 1.6; font-size: 1.1rem; }
        .modal-action { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #e2e8f0; }

        footer { background: var(--primary); color: white; text-align: center; padding: 3rem 2rem; border-top: 2px solid var(--accent); }

        /* =========================================
           DISEÑO RESPONSIVO (MÓVILES Y TABLETS)
           ========================================= */
        @media (max-width: 768px) {
            /* Mantiene logo y botón en la misma línea, reduciendo espacio */
            header { flex-direction: row; padding: 0.8rem 5%; }
            .logo-img { height: 50px; } /* Logo más pequeño en celular */
            .btn-whatsapp { padding: 0.4rem 1rem; font-size: 0.9rem; } /* Botón ajustado */
            
            /* Achica el título gigante de la portada */
            .hero { padding: 4rem 1rem 3rem; }
            .hero h1 { font-size: 3rem; letter-spacing: 2px; }
            .hero p { font-size: 1rem; }
            
            /* Reorganiza los filtros en una sola columna */
            .filters { margin: 1rem 5% 2rem; flex-direction: column; border-top: none; border-left: 4px solid var(--accent); }
            .filter-group { min-width: 100%; }
            
            /* Asegura que el catálogo ocupe el ancho correcto */
            .catalog { grid-template-columns: 1fr; padding: 0 5% 2rem; gap: 1.5rem; }
            
            /* Ajusta la ventana emergente (Modal) */
            .modal-content { width: 95%; margin-top: 5%; margin-bottom: 5%; }
            .modal-gallery img { height: 200px; } 
            .modal-info { padding: 1.5rem; }
            .modal-info h2 { font-size: 1.5rem; }
            .modal-info .price { font-size: 1.8rem; }
            .features { flex-direction: column; gap: 0.5rem !important; }
            
            /* Ajusta el botón de WhatsApp del modal */
            .modal-action .btn-whatsapp { display: block; text-align: center; padding: 1rem; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <a href="#">
            <img src="assets/REALTORS-transparente.png" alt="Realtors Inmobiliaria" class="logo-img">
        </a>
        <nav>
            <a href="https://wa.me/51999999999" target="_blank" class="btn-whatsapp">WhatsApp</a>
        </nav>
    </header>

    <section class="hero">
        <h1>REALTORS</h1>
        <p>Tu socio estratégico en bienes raíces. Exclusividad, rentabilidad y confianza.</p>
    </section>

    <!-- Filtros -->
    <section class="filters">
        <div class="filter-group">
            <label>Operación</label>
            <select id="opFilter"><option value="all">Ver Todo</option><option value="Venta">Ventas</option><option value="Alquiler">Alquileres</option></select>
        </div>
        <div class="filter-group">
            <label>Tipo de Inmueble</label>
            <select id="typeFilter"><option value="all">Ver Todo</option><option value="Departamento">Departamentos</option><option value="Casa">Casas</option></select>
        </div>
        <div class="filter-group">
            <label>Distrito</label>
            <select id="distritoFilter">
                <option value="all">Todas las zonas</option>
                <option value="Miraflores">Miraflores</option>
                <option value="San Isidro">San Isidro</option>
                <option value="Cusco">Cusco</option>
            </select>
        </div>
    </section>

    <div class="catalog-header"><h2 id="resultsCount">Propiedades Destacadas</h2></div>
    <section class="catalog" id="catalog"></section>

    <!-- Estructura del Modal -->
    <div id="propertyModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalBody">
                <!-- Contenido inyectado por JS -->
            </div>
        </div>
    </div>

    <footer>
        <h3>REALTORS Inmobiliaria EIRL</h3>
        <p style="opacity: 0.5; font-size: 0.8rem;">&copy; 2026 Todos los derechos reservados.</p>
    </footer>

    <script>
        // BASE DE DATOS EXTENDIDA
      const propiedades = [
            { 
                id: 1, 
                title: "Exclusiva Casa de 3 Pisos con Piscina y Cancha Privada", 
                type: "Casa", 
                op: "Venta", 
                distrito: "Cusco",
                price: "$ 1,225,000", 
                img: "assets/ventas/cusco/fachada-principal.jpeg", 
                beds: 6, 
                baths: 6, 
                area: "2,250m²",
                desc: "Espectacular propiedad de 2,250 m² en Condominio Los Pinos, Alto Qosqo. La casa de 3 pisos cuenta con sala, comedor, cocina y lavandería. El área de descanso ofrece 5 habitaciones (3 con balcón y baño privado) y mirador. Destaca por sus amenidades de lujo: piscina, 2 saunas (seco y vapor), salón de eventos con billar y 2 grandes patios. Además, incluye una cancha sintética privada con vestuarios y 4 baños (900 m²). Propiedad independizada, con 1,200 m² de área libre, servicios completos e inscrita en SUNARP.",
                gallery: [
                    "assets/ventas/cusco/fachada-principal.jpeg",
                    "assets/ventas/cusco/fachada-posterior.jpeg",
                    "assets/ventas/cusco/fachada-lateral.jpeg",
                    "assets/ventas/cusco/fachada-lateral2.jpeg",
                    "assets/ventas/cusco/fachada-secundaria.jpeg",
                    "assets/ventas/cusco/piscina2.jpeg",
                    "assets/ventas/cusco/cancha.jpeg",
                    "assets/ventas/cusco/cancha2.jpeg"
                ]
            }
        ];

        const catalog = document.getElementById('catalog');
        const modal = document.getElementById('propertyModal');
        const modalBody = document.getElementById('modalBody');

        function renderCatalog(data) {
            catalog.innerHTML = '';
            data.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(p.id); 
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <span class="tag">${p.op}</span>
                        <img src="${p.img}" alt="${p.title}" loading="lazy">
                    </div>
                    <div class="card-body">
                        <p class="price">${p.price}</p>
                        <h3 class="title">${p.title}</h3>
                        <div class="features">
                            <span>🛏️ ${p.beds}</span>
                            <span>🚿 ${p.baths}</span>
                            <span>📐 ${p.area}</span>
                        </div>
                    </div>
                `;
                catalog.appendChild(card);
            });
        }

        function openModal(id) {
            const p = propiedades.find(x => x.id === id);
            
            let galleryHTML = '';
            p.gallery.forEach(imgUrl => {
                galleryHTML += `<img src="${imgUrl}" alt="Vista del inmueble">`;
            });

            modalBody.innerHTML = `
                <div class="modal-gallery">
                    ${galleryHTML}
                </div>
                <div class="modal-info">
                    <span class="tag" style="position:relative; top:0; left:0; margin-bottom:1rem; display:inline-block;">${p.op}</span>
                    <h2>${p.title}</h2>
                    <p class="price">${p.price}</p>
                    <div class="features" style="justify-content: flex-start; gap: 2rem; font-size: 1.1rem; border:none; padding:0;">
                        <span>📍 ${p.distrito}</span>
                        <span>🛏️ ${p.beds} dorm.</span>
                        <span>🚿 ${p.baths} baños</span>
                        <span>📐 ${p.area}</span>
                    </div>
                    <hr style="border:0; border-top:1px solid #e2e8f0; margin: 1.5rem 0;">
                    <h3>Descripción de la Propiedad</h3>
                    <p>${p.desc}</p>
                    
                    <div class="modal-action">
                        <a href="https://wa.me/51999999999?text=Hola, estoy interesado en: ${p.title} (${p.price})" target="_blank" class="btn-whatsapp" style="display:inline-block; font-size:1.1rem; padding: 0.8rem 2rem;">Solicitar Visita por WhatsApp</a>
                    </div>
                </div>
            `;
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden'; 
        }

        function closeModal() {
            modal.style.display = 'none';
            document.body.style.overflow = 'auto'; 
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }

        renderCatalog(propiedades);

        const applyFilters = () => {
            const op = document.getElementById('opFilter').value;
            const type = document.getElementById('typeFilter').value;
            let filtered = propiedades;
            if(op !== 'all') filtered = filtered.filter(p => p.op === op);
            if(type !== 'all') filtered = filtered.filter(p => p.type === type);
            renderCatalog(filtered);
        };
        document.querySelectorAll('select').forEach(s => s.addEventListener('change', applyFilters));
    </script>
</body>
</html>
